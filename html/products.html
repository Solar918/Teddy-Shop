<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy Shop - Products</title>
    <link rel="stylesheet" href="/css/products.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="mainproducts">
        <!-- Header / Nav -->
        <header class="nav" w3-include-html="/html/nav.html" data-title="Teddy Shop - Products"></header>

        <!-- Page Content -->
        <div class="products-content">
            <!-- Main content -->
            <table class="products-table">
                <tr class="table-header">
                    <th>Image</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
                <tr>
                    <td><img src="/assets/images/product-bear1.avif" alt="Bear 1"></td>
                    <td>Bear 1</td>
                    <td>$10</td>
                    <td><button>Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="/assets/images/product-bear2.avif" alt="Bear 2"></td>
                    <td>Bear 2</td>
                    <td>$20</td>
                    <td><button>Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="/assets/images/product-bear3.jpg" alt="Bear 3"></td>
                    <td>Bear 3</td>
                    <td>$30</td>
                    <td><button>Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="/assets/images/product-bear4.jpg" alt="Bear 4"></td>
                    <td>Bear 4</td>
                    <td>$40</td>
                    <td><button>Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="/assets/images/product-bear5.jpg" alt="Bear 5"></td>
                    <td>Bear 5</td>
                    <td>$50</td>
                    <td><button>Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="/assets/images/product-bear6.avif" alt="Bear 6"></td>
                    <td>Bear 6</td>
                    <td>$60</td>
                    <td><button>Add to Cart</button></td>
                </tr>
            </table>
            
        </div>

        <!-- Footer -->
        <footer class="footer" w3-include-html="/html/footer.html"></footer>

        <script src="/js/includehtml.js"></script>
        <script>includeHTML();</script>
    </div>
</body>
</html>
